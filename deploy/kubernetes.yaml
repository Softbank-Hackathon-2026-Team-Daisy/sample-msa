# Generic, vendor-neutral reference manifest for the two HelloCalc services.
# The frontend reaches the backend by its Service name (http://hellocalc-backend).
# Build and publish both images to a registry your cluster can pull from, then
# set the image references below (or use `kubectl set image`).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellocalc-backend
  labels:
    app.kubernetes.io/name: hellocalc-backend
    app.kubernetes.io/part-of: hellocalc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hellocalc-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hellocalc-backend
        app.kubernetes.io/part-of: hellocalc
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hellocalc-backend
          image: hellocalc-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: info
            - name: SHUTDOWN_TIMEOUT
              value: 20s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hellocalc-backend
  labels:
    app.kubernetes.io/name: hellocalc-backend
    app.kubernetes.io/part-of: hellocalc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hellocalc-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellocalc-frontend
  labels:
    app.kubernetes.io/name: hellocalc-frontend
    app.kubernetes.io/part-of: hellocalc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hellocalc-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hellocalc-frontend
        app.kubernetes.io/part-of: hellocalc
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hellocalc-frontend
          image: hellocalc-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: http://hellocalc-backend
            - name: LOG_LEVEL
              value: info
            - name: SHUTDOWN_TIMEOUT
              value: 20s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hellocalc-frontend
  labels:
    app.kubernetes.io/name: hellocalc-frontend
    app.kubernetes.io/part-of: hellocalc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hellocalc-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
